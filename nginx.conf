server {
    listen 9833;
    server_name www.xtxk.top;
    
    # 智慧教育云平台前端项目
    location /smartedu-admin {
        alias /path/to/your/smart-education-platform/dist;  # 修改为您的实际dist目录路径
        try_files $uri $uri/ /smartedu-admin/index.html;
        index index.html;
        
        # 缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 如果需要处理 /login 这种路径（不带 /smartedu-admin 前缀）
    location / {
        # 方案1: 重定向到带前缀的路径
        # return 301 /smartedu-admin$request_uri;
        
        # 方案2: 直接指向 index.html（如果确实需要这种路由）
        root /path/to/your/smart-education-platform/dist;  # 修改为您的实际dist目录路径
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}